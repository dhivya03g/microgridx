<!DOCTYPE html>
<html>
<head>
<title>Login - MicroGridX</title>

<style>
body{
background:#020617;
color:white;
font-family:Segoe UI;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#0f172a;
padding:30px;
border-radius:10px;
width:300px;
box-shadow:0 0 20px black;
}

input{
width:100%;
padding:10px;
margin-top:10px;
background:#020617;
border:1px solid #334155;
color:white;
border-radius:6px;
}

button{
width:100%;
padding:10px;
margin-top:15px;
background:#38bdf8;
border:none;
color:black;
cursor:pointer;
border-radius:6px;
}

a{
color:#38bdf8;
font-size:12px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="box">
<h2>Login</h2>

<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<p><a onclick="forgotPassword()">Forgot Password?</a></p>

</div>

<script>

async function login(){

let u=document.getElementById("username").value
let p=document.getElementById("password").value

// DEMO AUTH
if(u==="admin" && p==="1234"){
localStorage.setItem("user",u)
window.location.href="index.html"
}
else{
alert("Invalid Credentials")
}
}

// FORGOT PASSWORD
function forgotPassword(){
alert("Demo Password: admin / 1234")
}

</script>

</body>
</html>
